name: Fixture engine CI

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/fixture-engine-ci.yml"
  push:
    branches:
      - feat/fixture-engine-endpoint
    paths:
      - "src/**"
      - "supabase/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/fixture-engine-ci.yml"

permissions:
  contents: read

jobs:
  frontend-and-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run multiplayer engine tests
        run: bun test tests/mpEngine.test.ts tests/fixtureEngineAdapter.test.ts
      - name: Build frontend
        run: bun run build

  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install npm dependencies for Deno node_modules resolution
        run: bun install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check fixture engine Edge Function
        run: deno check supabase/functions/mp-fixture-engine/index.ts
